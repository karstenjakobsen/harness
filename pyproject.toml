[dependency-groups]
dev = [
    "httpx2>=2.16,<3",
    "jinja2>=3.1,<4",
    "pytest>=9,<10",
    "ruff>=0.15.11",
]

[tool.uv.workspace]
members = ["packages/harness_api", "packages/harness_mcp", "packages/harness_operator"]

[tool.pytest.ini_options]
markers = [
    "live: requires a signed-in Codex session and the real MCP server",
    "nomad: runs workloads on the development Nomad cluster",
]
testpaths = ["packages/harness_api/tests", "packages/harness_mcp/tests", "packages/harness_operator/tests", "dev/phase2"]

[tool.ruff]
target-version = "py314"
src = ["packages/harness_api/src", "packages/harness_mcp/src", "packages/harness_operator/src"]

[tool.ruff.lint]
extend-select = ["I"]
