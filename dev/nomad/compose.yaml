services:
  server:
    image: hashicorp/nomad:2.1.1@sha256:1a9a0a9ab149a6dd05fd5219e11273a20507a108ab191db26360f0843359ddf7
    command: ["agent", "-config=/config/server.hcl"]
    ports:
      - "127.0.0.1:14646:14646"
      - "127.0.0.1:14647:14647"
    volumes:
      - ./server.hcl:/config/server.hcl:ro
      - server-data:/nomad/data
    healthcheck:
      test: ["CMD-SHELL", "nomad operator raft list-peers -address=http://127.0.0.1:14646 | grep -qw leader"]
      interval: 2s
      timeout: 2s
      retries: 25

volumes:
  server-data:
