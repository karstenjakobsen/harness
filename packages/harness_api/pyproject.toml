[project]
name = "harness-api"
version = "0.1.0"
description = "The FastAPI service for saved Harness goals."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.165,<1",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "uvicorn>=0.30,<1",
]

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"
