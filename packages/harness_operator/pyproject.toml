[project]
name = "harness-operator"
version = "0.1.0"
description = "A small CLI for talking to a Codex goal operator."
requires-python = ">=3.14,<3.15"
dependencies = ["click>=8.1,<9", "harness-api", "harness-mcp", "pydantic>=2,<3"]

[project.scripts]
harness-operator = "harness_operator:main"
operator = "harness_operator:main"

[tool.uv.sources]
harness-api = { workspace = true }
harness-mcp = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"
