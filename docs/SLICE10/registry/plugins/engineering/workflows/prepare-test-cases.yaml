kind: workflow
id: prepare-test-cases
stage: preview
input: [work_item_id]
steps:
  - id: write-cases
    action: worker
    profile: engineering@1/test-writer
    result_format: test-cases
  - id: check-shape
    action: validate_result
    depends_on: [write-cases]
    result_format: test-cases
  - id: review
    action: operator_review
    depends_on: [check-shape]
    profile: engineering@1/test-planner
