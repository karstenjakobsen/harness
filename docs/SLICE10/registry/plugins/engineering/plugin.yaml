kind: plugin
id: engineering
revision: 1
name: Engineering
description: Plan engineering work, prepare test cases, and review evidence.
tags: [engineering, planning, testing, review]
skills:
  - id: planning-and-task-breakdown
    revision: 1
    name: Planning and task breakdown
    description: Turn a goal or brief into ordered work with observable acceptance criteria.
    author: Addy Osmani (upstream), adapted for Harness
  - id: test-driven-development
    revision: 1
    name: Test-driven development
    description: Reproduce a behavior gap with a focused failing test, fix it, and verify the result.
    author: Addy Osmani (upstream), adapted for Harness
  - id: code-review-and-quality
    revision: 1
    name: Code review and quality
    description: Review a change for correctness, maintainability, architecture, security, and performance.
    author: Addy Osmani (upstream), adapted for Harness
  - id: chess-rules
    revision: 1
    name: Chess rules
    description: Plan legal move generation and verify check, pins and king safety.
    author: Harness
  - id: go-testing
    revision: 1
    name: Go testing
    description: Turn rules and counterexamples into table-driven Go tests with explicit expected results.
    author: Harness
profiles:
  - id: test-planner
    file: profiles/test-planner.yaml
  - id: test-writer
    file: profiles/test-writer.yaml
result_formats:
  - id: test-cases
    schema: schemas/test-cases.schema.json
