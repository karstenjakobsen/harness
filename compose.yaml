name: harness-poc
services:
  harness:
    image: ${COMPOSE_PROJECT_NAME}-app:local
    build:
      context: .
      target: app
    environment:
      WORKER_IMAGE: ${COMPOSE_PROJECT_NAME}-worker:local
      WORKER_NETWORK: ${COMPOSE_PROJECT_NAME}_default
      WORKER_UID: ${WORKER_UID:-1000}
      CODEX_AUTH_FILE: ${CODEX_AUTH_FILE:-}
      CODEX_API_KEY: ${CODEX_API_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - evidence:/data
      - operator-key:/operator
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20
  operator:
    image: ${COMPOSE_PROJECT_NAME}-app:local
    profiles: [cli]
    entrypoint: ["python", "-m", "harness.operator"]
    volumes:
      - operator-key:/operator:ro
  worker:
    image: ${COMPOSE_PROJECT_NAME}-worker:local
    profiles: [build]
    build:
      context: .
      target: worker

volumes:
  evidence:
  operator-key:
