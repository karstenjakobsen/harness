services:
  nomad:
    image: hashicorp/nomad:2.1.1@sha256:1a9a0a9ab149a6dd05fd5219e11273a20507a108ab191db26360f0843359ddf7
    entrypoint: ["/bin/nomad"]
    command: ["agent", "-config=/etc/harness/server.hcl"]
    volumes:
      - ./nomad/server.hcl:/etc/harness/server.hcl:ro
      - nomad-server:/nomad/data
    ports:
      - "127.0.0.1:4647:4647"
    networks: [control]
    healthcheck:
      test: ["CMD", "/bin/nomad", "operator", "raft", "list-peers"]
      interval: 2s
      timeout: 3s
      retries: 25
  harness:
    environment:
      NOMAD_ADDR: http://nomad:4646
    volumes: !override
      - evidence:/data
      - operator-key:/operator
    networks: [default, control]
    depends_on:
      nomad:
        condition: service_healthy

networks:
  control:
volumes:
  nomad-server:
